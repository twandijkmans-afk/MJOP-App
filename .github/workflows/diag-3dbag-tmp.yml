name: Diagnose 3DBAG (tijdelijk)
on:
  push:
    branches: [claude/diag-3dbag-tmp]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: DNS en certificaat
        continue-on-error: true
        run: |
          set +e
          for H in api.3dbag.nl data.3dbag.nl docs.3dbag.nl; do echo "== $H A: $(dig +short $H A | tr '\n' ' ') AAAA: $(dig +short $H AAAA | tr '\n' ' ') CNAME: $(dig +short $H CNAME)"; done
          echo "== api.3dbag.nl via IPv6"; curl -6 -sS -m 20 -o /dev/null -w "HTTP %{http_code}\n" https://api.3dbag.nl/ 2>&1 | tail -1
          echo "== docs-cert:"; echo | openssl s_client -connect docs.3dbag.nl:443 -servername docs.3dbag.nl 2>/dev/null | openssl x509 -noout -dates -ext subjectAltName 2>/dev/null
      - name: Documentatie - huidige API-adressen
        continue-on-error: true
        run: |
          set +e
          for P in en/ en/delivery/webservices/ en/delivery/ en/schema/attributes/; do
            echo "===== https://docs.3dbag.nl/$P"
            curl -sS -m 30 "https://docs.3dbag.nl/$P" -o p.html -w "HTTP %{http_code}\n"
            grep -oE "https?://[a-z0-9.-]*3dbag[a-z0-9./_?=&%-]*" p.html | sort -u | head -30
            python3 -c "
          import re,html
          t=open('p.html',encoding='utf-8',errors='ignore').read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S)
          t=html.unescape(re.sub(r'<[^>]+>',' ',t)); t=re.sub(r'\s+',' ',t)
          for kw in ('API','WFS','OGC','deprecat','status','outage','maintenance','v2025','v2024','b3_h_dak_max','b3_opp_dak_plat'):
              for m in re.finditer(kw,t):
                  print('...',t[max(0,m.start()-120):m.end()+160],'...'); break
          "
          done
