name: diag-3dbag-pand
on:
  push:
    branches: [claude/diag-3dbag-tmp2]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: pand ophalen
        shell: bash
        run: |
          set +e
          echo "== $(date -u) =="
          for P in 0424100000003525 0363100012137996; do
            for i in 1 2 3 4 5; do
              curl -sS -D h.txt -o p_$P.json -H "Origin: https://twandijkmans-afk.github.io" -w "$P try$i http=%{http_code} tls=%{time_appconnect}s ttfb=%{time_starttransfer}s t=%{time_total}s size=%{size_download}\n" -m 40 "https://api.3dbag.nl/collections/pand/items/NL.IMBAG.Pand.$P"
            done
            grep -i "access-control\|content-type" h.txt
            python3 - "$P" <<'PY'
          import json,sys
          P=sys.argv[1]
          try:
              j=json.load(open(f'p_{P}.json'))
          except Exception as e:
              print('geen JSON', e, open(f'p_{P}.json').read()[:300]); sys.exit()
          print('type', j.get('type'), 'feature.type', (j.get('feature') or {}).get('type'))
          co=(j.get('feature') or {}).get('CityObjects') or {}
          print('CityObjects', list(co.keys())[:6])
          o=co.get('NL.IMBAG.Pand.'+P)
          if not o: print('PAND ONTBREEKT'); sys.exit()
          a=o.get('attributes',{})
          for k in sorted(a):
              if k.startswith('b3_') or k in ('oorspronkelijkbouwjaar','status','identificatie'): print(' ',k,'=',a[k])
          PY
          done
          echo "== klaar $(date -u) =="
