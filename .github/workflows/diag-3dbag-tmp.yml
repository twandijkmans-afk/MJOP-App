name: Diagnose 3DBAG (tijdelijk)
on:
  push:
    branches: [claude/diag-3dbag-tmp]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: 3DBAG API per pand (status, tijd, CORS, formaat)
        run: |
          ORIGIN=https://twandijkmans-afk.github.io
          for P in 0424100000003525 0363100012137996; do
            U="https://api.3dbag.nl/collections/pand/items/NL.IMBAG.Pand.$P"
            echo "=================== $U"
            for i in 1 2 3; do
              curl -sS -m 60 -H "Origin: $ORIGIN" -D h_$P.txt -o b_$P.json \
                -w "poging $i: HTTP %{http_code}  connect %{time_connect}s  eerste-byte %{time_starttransfer}s  totaal %{time_total}s  bytes %{size_download}\n" "$U" || echo "poging $i: curl-fout $?"
            done
            echo "--- headers (laatste poging)"; grep -iE "^(HTTP|content-type|access-control|cache|content-length|server|date)" h_$P.txt || true
            echo "--- inhoud"
            python3 - "$P" <<'PY'
          import json, sys
          p = sys.argv[1]
          raw = open(f"b_{p}.json", "rb").read()
          print("eerste bytes:", raw[:120])
          try:
              j = json.loads(raw)
          except Exception as e:
              print("GEEN JSON:", e); sys.exit(0)
          print("top-level keys:", list(j.keys())[:12], "type:", j.get("type"))
          f = j.get("feature")
          print("feature aanwezig:", f is not None)
          if f:
              co = f.get("CityObjects", {})
              print("CityObjects keys:", list(co.keys())[:8])
              k = "NL.IMBAG.Pand." + p
              o = co.get(k)
              print("verwachte key aanwezig (app-parse):", o is not None)
              if o:
                  a = o.get("attributes", {})
                  keys = ["b3_opp_dak_plat","b3_opp_dak_schuin","b3_opp_buitenmuur","b3_opp_grond","b3_opp_scheidingsmuur","b3_bouwlagen","b3_dak_type","b3_h_dak_max","b3_h_dak_50p","b3_h_maaiveld","b3_pw_datum","b3_kwaliteitsindicator","b3_succes_multi_ground","b3_val3dity_lod22","oorspronkelijkbouwjaar","status"]
                  for kk in keys: print("  ", kk, "=", a.get(kk, "<ONTBREEKT>"))
                  print("   alle attribuutnamen:", sorted(a.keys()))
          for k in ("metadata","links","numberMatched","code","description","detail","title"):
              if k in j: print(k, "=", str(j[k])[:300])
          PY
          done
      - name: Collections en versie
        run: |
          curl -sS -m 60 -w "\nHTTP %{http_code} %{time_total}s\n" https://api.3dbag.nl/collections/pand | head -c 1500; echo
          curl -sS -m 60 -w "\nHTTP %{http_code} %{time_total}s\n" https://api.3dbag.nl/ | head -c 800; echo
      - name: Alternatief - 3DBAG WFS (data.3dbag.nl)
        run: |
          for P in 0424100000003525 0363100012137996; do
            for T in BAG3D:lod22 BAG3D:lod13 BAG3D:pand; do
              U="https://data.3dbag.nl/api/BAG3D/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=$T&outputFormat=application/json&count=1&CQL_FILTER=identificatie='NL.IMBAG.Pand.$P'"
              echo "=== $P $T"
              curl -sS -m 60 -H "Origin: https://twandijkmans-afk.github.io" -D wh.txt -o w.json -w "HTTP %{http_code} %{time_total}s\n" "$U" || true
              grep -iE "^(content-type|access-control)" wh.txt || true
              python3 -c "
          import json
          try:
              j=json.load(open('w.json')); fs=j.get('features',[]); print('features:',len(fs))
              if fs: print(json.dumps({k:v for k,v in fs[0]['properties'].items() if k.startswith('b3_') or k in ('identificatie','oorspronkelijkbouwjaar')})[:1200])
          except Exception as e: print('geen JSON:', open('w.json','rb').read()[:200], e)"
            done
          done
      - name: WFS capabilities (welke lagen)
        run: |
          curl -sS -m 60 "https://data.3dbag.nl/api/BAG3D/wfs?service=WFS&request=GetCapabilities" | grep -oE "<(wfs:)?Name>[^<]+</(wfs:)?Name>" | head -20 || true
