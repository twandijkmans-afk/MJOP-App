name: diag-live-site
on:
  push:
    branches: [claude/diag-3dbag-tmp2]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: live site controleren
        shell: bash
        run: |
          set +e
          B=https://twandijkmans-afk.github.io/MJOP-App
          curl -sS -o idx.html -w "index http=%{http_code} size=%{size_download}\n" "$B/?nc=$RANDOM"
          curl -sS -o app.js -w "app.js http=%{http_code} size=%{size_download}\n" "$B/src/app.js?nc=$RANDOM"
          curl -sS -o q.js -w "quantity.js http=%{http_code}\n" "$B/src/quantity.js?nc=$RANDOM"
          for k in "d3-overnemen" "3D-model beschikbaar — controle nodig" "b3_kwaliteitsindicator" "Technische details" "planSnapshot" "Grove geometrische aanname" "d3voorstel"; do echo "app.js '$k': $(grep -c -- "$k" app.js)"; done
          echo "quantity.js accepted_by_user_at: $(grep -c accepted_by_user_at q.js)"
          sha256sum app.js q.js
          grep -o 'src/app.js[^"]*' idx.html | head -3
          echo "== 3D BAG API nu =="
          curl -sS -o /dev/null -w "api http=%{http_code} t=%{time_total}s\n" -m 20 https://api.3dbag.nl/collections/pand/items/NL.IMBAG.Pand.0424100000003525
