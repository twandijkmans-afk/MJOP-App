<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>MJOP Live — onderhoudsplanning voor kleine VvE's</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Meerjarenonderhoudsplan voor kleine VvE's, gebouwd op echte BAG- en 3D BAG-data.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#101211">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="root"></div>
<!-- Client-side parsers for "upload een bestaand MJOP" (xlsx/csv + pdf tekstextractie).
     Op jsdelivr i.p.v. cdnjs en met Subresource Integrity: jsdelivr's npm-CDN
     serveert de bestanden ongewijzigd zoals gepubliceerd op npm, dus de hash
     hieronder (berekend uit het echte npm-pakket) is geverifieerd correct —
     bij cdnjs kon dat niet met zekerheid, dat is een eigen packageproces. -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.min.js" integrity="sha384-uLiAv4VcjM5H2Jsqzl8EajEaxPugj1CIzQaCjQ8c5//vC+elhxO5pZfXGxoLQi1W" crossorigin="anonymous"></script>
<script>
  if (window.pdfjsLib) {
    // Web Workers ondersteunen geen integrity-attribuut (dat bestaat alleen
    // op <script>-tags) — de versie staat wel vast, net als de twee hierboven.
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@2.16.105/build/pdf.worker.min.js';
  }
</script>
<!-- Supabase (inloggen; later ook opslaan/heropenen — zie SPEC_ACCOUNTS_AND_SAVING.md).
     Vastgezet op een exact versienummer i.p.v. de eerdere "@2" (die altijd de
     nieuwste 2.x-release pakt, zonder aankondiging) — zelfde jsdelivr/SRI-
     redenering als hierboven. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
<script src="src/config.js"></script>
<script src="src/app.js"></script>
</body>
</html>
